onboarding = false

[ui]
mouse_capture = false
status_indicators = "symbols"
prompt_new_tab_name = false
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [["state_icon", "agent"]]
row_gap = 0

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "agent"], ["terminal_title"]]
codex = [["state_icon", "agent"], ["terminal_title"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]
row_gap = 0

[keys]
prefix = "alt+space"
edit_scrollback = "prefix+shift+e"
rename_tab = "prefix+comma"
previous_agent = "prefix+up"
next_agent = "prefix+down"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "toggle Neovim sidebar"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "herdr-repo-picker.open-picker"
description = "open ghq repository"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "fzf-url"
description = "open URL from pane"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle diff review pane"

[experimental]
switch_ascii_input_source_in_prefix = true
